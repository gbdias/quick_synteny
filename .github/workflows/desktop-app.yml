# Builds the desktop app (gui/) for every platform it supports, checks that
# each build actually works, and keeps the results as run artifacts. It
# doesn't publish anything: releases are separate.
#
# The app bundles the pipeline, so a pipeline change rebuilds it too.

name: Desktop app

on:
  push:
    paths:
      - gui/**
      - main.nf
      - nextflow.config
      - nextflow_schema.json
      - bin/**
      - modules/**
      - conf/**
      - envs/**
      - .github/workflows/desktop-app.yml
  pull_request:
    paths:
      - gui/**
      - main.nf
      - nextflow.config
      - nextflow_schema.json
      - bin/**
      - modules/**
      - conf/**
      - envs/**
      - .github/workflows/desktop-app.yml
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or PR supersedes a running build
concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: gui

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      # one platform failing shouldn't hide whether the others work
      fail-fast: false
      matrix:
        include:
          # each built on its own architecture, so the smoke test runs the
          # real thing; macOS 15 rather than 26, so the app isn't built
          # against only the newest macOS
          - { target: mac-arm64, runner: macos-15 }
          - { target: mac-x64, runner: macos-15-intel }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci

      - name: Build
        run: npm run dist:${{ matrix.target }}
        env:
          # no certificates here: package.json's mac.identity "-" ad-hoc signs
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # --smoke-test: first-launch setup into a scratch folder (bundled
      # micromamba, then Nextflow, Java and the weblog plugin), then
      # `nextflow run main.nf --help -profile conda` on the bundled
      # pipeline -- see gui/lib/smoke.js
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: dist/mac*/quick_synteny.app/Contents/MacOS/quick_synteny --smoke-test
        env:
          QS_HOME: ${{ runner.temp }}/qs_home

      # Linux runners have no display and no FUSE: Xvfb for the first, and
      # APPIMAGE_EXTRACT_AND_RUN so the AppImage unpacks itself instead of
      # mounting. --no-sandbox because an unpacked AppImage's chrome-sandbox
      # isn't setuid root (and Ubuntu 24.04 restricts the namespaces
      # Electron's other sandbox needs).
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/*.AppImage
          xvfb-run -a dist/*.AppImage --no-sandbox --smoke-test
        env:
          QS_HOME: ${{ runner.temp }}/qs_home
          APPIMAGE_EXTRACT_AND_RUN: '1'

      - uses: actions/upload-artifact@v7
        with:
          name: quick_synteny-${{ matrix.target }}
          path: |
            gui/dist/*.dmg
            gui/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
